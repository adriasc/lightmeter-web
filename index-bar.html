<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Film Light Meter (Horizontal Bars)</title>
    <link rel="stylesheet" href="styles-bar.css?v=2.7.2" />
  </head>
  <body>
    <main class="app">
      <header class="topbar glass">
        <h1>Film Light Meter</h1>
        <div class="topbar-right">
          <div class="ev-readout">EV100 <span id="evReadout">--.-</span> | <span id="appVersion">v---</span></div>
          <div class="mode-switch" role="group" aria-label="Metering mode">
            <button id="modeSimpleBtn" class="mode-btn is-active" type="button" aria-pressed="true">Simple</button>
            <button id="modeProBtn" class="mode-btn" type="button" aria-pressed="false">Pro</button>
          </div>
        </div>
      </header>

      <section class="camera-wrap" id="cameraWrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="meterCanvas"></canvas>
        <div id="zoneOverlay" class="zone-overlay"></div>
        <div id="tapMarker" class="tap-marker" aria-hidden="true"></div>
        <div id="avgMarkers" class="avg-markers" aria-hidden="true"></div>
        <button id="startBtn" class="start-btn">Start Camera</button>
      </section>

      <p id="hintBanner" class="hint glass">Tap to lock exposure. Each number covers about 1/14 width x 1/10 height of frame.</p>

      <section class="bottom-panel glass">
        <div class="iso-row">
          <label for="isoSelect">ISO</label>
          <select id="isoSelect"></select>
        </div>

        <section id="proPanel" class="pro-panel">
          <div class="pro-row">
            <label for="filmProfileSelect">Film</label>
            <select id="filmProfileSelect"></select>
          </div>
          <div class="pro-row pro-row-lat">
            <label for="shadowLatitudeInput">-</label>
            <input id="shadowLatitudeInput" type="number" step="0.1" min="0.5" max="12" />
            <label for="highlightLatitudeInput">+</label>
            <input id="highlightLatitudeInput" type="number" step="0.1" min="0.5" max="12" />
            <span id="clipStats" class="clip-stats">Profile clip S 0% | H 0%</span>
          </div>
        </section>

        <div class="bar-block no-gap">
          <div class="ruler-wrap">
            <div class="ruler-center-line" aria-hidden="true"></div>
            <div id="apertureRuler" class="exposure-ruler"></div>
          </div>
        </div>

        <div class="bar-block no-gap">
          <div class="ruler-wrap">
            <div class="ruler-center-line" aria-hidden="true"></div>
            <div id="shutterRuler" class="exposure-ruler"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="app-bar.js?v=2.7.2"></script>
  </body>
</html>
